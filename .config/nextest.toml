# 数万段の入れ子を解析するストレステスト。ほかのテストと違って CPU を長く使い、各コマンドに 300 秒の期限がある。
# 最初に始めて最後まで残らないようにし、2 スレッド分を割り当てて CPU の取り合いを減らす
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & (test(=integration::deep_nesting::rust_impact_proofs_handle_deep_nesting) | test(=integration::deep_nesting::rust_visibility_paths_handle_deep_nesting) | test(=integration::deep_nesting::api_optional_object_extension_handles_deep_union))'
priority = 100
threads-required = 2

# 深い module の範囲と依存の伝播を確認する回帰を先に実行し、CPU の取り合いを減らす。
[[profile.default.overrides]]
filter = 'test(=commands::api_changes::rust_opaque_return::tests::opaque_returns_mark_only_their_own_module_scope) | test(=commands::api_changes::rust_opaque_return::tests::opaque_returns_keep_deep_private_module_dependencies_local)'
