# cargo-nextest の設定。make test と CI のテストジョブが読む (版は mise.toml で固定する)。
# nextest はテストを 1 件ずつ別のプロセスで走らせる (libtest のようにテスト間で static を共有しない)。
# 並列数は既定 (CPU 数) のまま。テストは git と astro-sight の子プロセスを起動するので、CPU 数より増やすと
# 子プロセスが CPU を取り合い、かえって遅くなる (CI の 4 コアの Linux / Windows で確かめた)
nextest-version = { required = "0.9.150" }

[profile.default]
# 60 秒を超えたテストを報告する (libtest の "has been running for over 60 seconds" と同じ間隔)。報告だけで止めない
slow-timeout = { period = "60s" }

# Clap の表示文と opaque 戻り値について、通常・index の Cargo 設定やマクロを対比する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::review::clap_about_)'
priority = 50
threads-required = 2

# TS の分割代入引数で型・束縛・整形の違いを作業ツリーと index から検査する。
[[profile.default.overrides]]
filter = 'test(=integration::destructured_optional_defaults::unannotated_object_parameters_report_inferred_contract_changes) | test(integration::destructured_optional_defaults::optional_prop_additions_check_)'
priority = 50
threads-required = 2

# TypeScript の型問い合わせ・書き込みと値の読み取りを、通常・index の複数の構成で検証する。
[[profile.default.overrides]]
filter = 'test(=integration::impact_object_members::impact_object_members_keep_reads_checked_against_type_queries_blocking) | test(=integration::impact_object_members::impact_object_members_keep_reads_blocking_across_writers)'
priority = 50
threads-required = 2

# TypeScript の再公開と移動後の利用を、複数のモジュールで通常・index の両方から調べる。
[[profile.default.overrides]]
filter = 'test(=integration::moved_compatible_change::typescript_move_checks_source_reexports)'
priority = 50
threads-required = 2

# C++ の推論された受け手と明示型を、通常・index で対比する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::impact_cpp_inferred_receivers::)'
priority = 50
threads-required = 2

# index のリンク・submodule と通常の namespace を、Git の mode で対比する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::impact_python_snapshot_namespaces::)'
priority = 50
threads-required = 2

# 内包表記の束縛と通常の namespace を、通常・index の7形式で対比する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::impact_python_comprehensions::)'
priority = 50
threads-required = 2

# 同名の別定義があっても、通常・index の実際のメソッド呼び出しを保持する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::impact_competing_definitions::)'
priority = 50
threads-required = 2

# Python の同名呼出しの帰属を、通常・index・未知の受け手の対照で確認する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::python_method_closure::)'
priority = 50
