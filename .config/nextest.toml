# cargo-nextest の設定。make test と CI のテストジョブが読む (版は mise.toml で固定する)。
# nextest はテストを 1 件ずつ別のプロセスで走らせる (libtest のようにテスト間で static を共有しない)。
# 並列数は既定 (CPU 数) のまま。テストは git と astro-sight の子プロセスを起動するので、CPU 数より増やすと
# 子プロセスが CPU を取り合い、かえって遅くなる (CI の 4 コアの Linux / Windows で確かめた)
nextest-version = { required = "0.9.149" }

[profile.default]
# 60 秒を超えたテストを報告する (libtest の "has been running for over 60 seconds" と同じ間隔)。報告だけで止めない
slow-timeout = { period = "60s" }

# 数万段の入れ子を解析するストレステスト。ほかのテストと違って CPU を長く使い、各コマンドに 300 秒の期限がある。
# 最初に始めて最後まで残らないようにし、2 スレッド分を割り当てて CPU の取り合いを減らす
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & (test(=integration::deep_nesting::rust_impact_proofs_handle_deep_nesting) | test(=integration::deep_nesting::rust_visibility_paths_handle_deep_nesting))'
priority = 100
threads-required = 2

# worktree と index の公開経路を複数の cfg 構成で確認する回帰を先に始める。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & (test(=integration::rust_relative_reexport::review_rust_glob_module_shadow_requires_unconditional_binding) | test(=integration::rust_relative_reexport::review_rust_global_reexport_distinguishes_external_and_local_crates) | test(=integration::rust_relative_reexport::review_rust_public_signatures_expose_hidden_types_individually) | test(=integration::rust_relative_reexport::review_rust_cfg_reexports_require_module_activation_proof) | test(=integration::rust_relative_reexport::review_rust_glob_external_names_require_complete_namespace_proof))'
priority = 50
threads-required = 2

# 変更された JSX / object 呼び出しを worktree と index の両方で確認する回帰を先に始める。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::optional_props_removal::optional_props_removal_changed_callers_require_removed_key_proof)'
priority = 50
threads-required = 2

# 非公開型の変更を、通常と index の公開契約へ伝える回帰を先に始める。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::signature_type_dependencies::public_signature_type_dependencies_report_changed_contracts)'
priority = 50
threads-required = 2

# 祖先の設定・無関係なエントリを大量に作る回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & (test(=integration::ts_extension_changes::ts_extension_changes_ignore_unrelated_ancestor_entries_and_snapshot_location) | test(=integration::ts_extension_changes::ts_extension_changes_config_budget_is_deduplicated_and_reported))'
priority = 50
threads-required = 2

# factory の入力・既定値・呼び出しを複数の構成で確認する回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::required_type_members::partial_factories_)'
priority = 50
threads-required = 2

# 型付き配列の全要素と書き込み・持ち出しを、通常と index で検証する回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(integration::required_type_members::typed_array_)'
priority = 50
threads-required = 2

# 判別 union の削除と不明な値の流れを、通常と index で検証する回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::literal_union_removal::discriminated_union_removal_checks_switches_payloads_and_unsupported_flows)'
priority = 50
threads-required = 2

# Rust の同名所有元とマクロ・モジュール配置の対照を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & (test(=integration::impact_rust_private_helpers::impact_rust_enum_variants_have_their_own_declaration_owner) | test(=integration::impact_rust_private_helpers::impact_rust_format_arguments_require_standard_macro_binding) | test(=integration::impact_rust_same_named_constants::impact_rust_same_named_constants_keep_unproven_bindings))'
priority = 50
threads-required = 2

# TS / TSX の generic tagged template と互換性を通常・index で確認する回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::typescript_grammar::typescript_generic_tagged_template_keeps_optional_parameter_compatibility)'
priority = 50
threads-required = 2

# 証明理由の一致と staged snapshot を複数構成で検証する回帰を先に実行する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::required_type_members::type_modifications_explain_unverified_proofs_without_changing_classification)'
priority = 50
threads-required = 2

# props の局所的な型別名と型参照・未証明の構文を複数の構成で確認する。
[[profile.default.overrides]]
filter = 'binary_id(astro-sight::integration) & test(=integration::optional_props_removal::optional_props_alias_removal_rejects_supplied_spread_and_type_level_uses)'
priority = 50
threads-required = 2

# CI (NEXTEST_PROFILE=ci): 失敗しても残りのテストを最後まで流し、失敗の出力を最後にもまとめて出す
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
