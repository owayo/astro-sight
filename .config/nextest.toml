# 混在 hunk の Python 宣言と、4096 エントリの名前空間予算を先に検証する。
[[profile.default.overrides]]
filter = '(binary_id(astro-sight::integration) & test(integration::python_added_declarations::)) | test(=engine::impact::python_imports::non_method::tests::python_namespace_cache_preserves_the_combined_ancestor_entry_budget) | test(=engine::impact::python_imports::non_method::tests::python_namespace_src_root_shares_the_ancestor_entry_budget_without_double_counting)'
