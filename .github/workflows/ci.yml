name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 全ジョブが独立して始まり、壁時計は最も長いジョブで決まる。テストは nextest の slice で OS ごとに複数のランナーへ
# 分け、どのシャードも配布用の build (約 7 分) と同じころに終わることを目安に数を決めている (macOS のランナーは
# 速さのばらつきが大きく、lint も回す 1 番目は build より長くなることがある)。
# キャッシュは main への push だけが保存する。PR は main のキャッシュを読むだけにして、PR ごとのキャッシュで
# 容量の上限 (10GB) を使い切らない (使い切ると古い順に追い出され、main のキャッシュも消える)
jobs:
  # 検査の中身は Makefile が定義する (lint は make check、テストは make test)。
  # ここには OS 固有の準備とテストの分け方だけを置き、検査コマンドを重ねて書かない
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正。mise 本体は公開から 14 日以上たった版を固定し、署名付きの checksum で
      # 確かめて入れる。cache は切る。mise-action のキャッシュは mise の導入済みの印だけを戻し、rustup が
      # 持つツールチェーンと components (clippy / rustfmt) を戻さないため、復元した回だけ
      # 'cargo-clippy' is not installed で落ちる (jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)。
      # clippy の成果物はテストのビルドと別物なので、test とは鍵を分ける
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: make setup
      - run: make check

  # テストを OS ごとに複数のランナーへ分ける (nextest の slice。件数で均等に分ける)。シャードはどれも同じ
  # テストバイナリをビルドするので、キャッシュは OS ごとに 1 つを共有して 1 番目だけが保存する。
  # doctest は分けられないので 1 番目だけが回す (doc: 0 で残りは飛ばす)
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.partition }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows は入れない。ランナーの make は MinGW の mingw32-make の写しで、レシピの POSIX シェル前提
        # ($$(...) や [ -n ... ]) の解釈に癖がある。Windows のテストは test-windows で cargo を直接呼ぶ。
        # macOS は lint も 1 番目で回す (make ci = check + test)。lint を別のランナーにすると、build の 2 つと
        # 合わせて macOS の同時実行の上限 (Free は 5) を使い切り、ほかの実行を待たせる
        include:
          - { os: ubuntu-latest, partition: 1, target: test, doc: 1 }
          - { os: ubuntu-latest, partition: 2, target: test, doc: 0 }
          - { os: macos-latest, partition: 1, target: ci, doc: 1 }
          - { os: macos-latest, partition: 2, target: test, doc: 0 }
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}

      - run: make setup
      - run: make ${{ matrix.target }} TEST_PARTITION=slice:${{ matrix.partition }}/2 TEST_DOC=${{ matrix.doc }}

  # Makefile の test と同じことを cargo で直接呼ぶ。Windows は 4 コアのランナーでテストが最も遅いので、
  # Linux / macOS より多くのランナーへ分ける
  test-windows:
    name: Test (windows-latest, ${{ matrix.partition }}/5)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    env:
      NEXTEST_PROFILE: ci
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。テストの期待値や include_str! で
      # 埋め込む skills/SKILL.md の改行を配布物とそろえるため、LF のまま取る
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false

      # 鍵の名前は Linux / macOS の test と同じ (OS とアーキテクチャは rust-cache が鍵に足す)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}

      # テストは一時リポジトリを TEMP に作り、そこで git と astro-sight を何度も起動する。既定の TEMP (C:) より、
      # 作業ツリーと同じドライブにある runner.temp (D:) の方が速い (同じテストが C: では 1.6 倍かかった)
      - name: Put temporary files next to the workspace
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # PATH で見つかる git (Git for Windows の bin\git.exe) は、本体の git.exe を子プロセスとして起動する
      # ラッパーで、起動のたびにプロセスが 1 つ増える。テストは git を何千回も起動するので、このステップだけ
      # 本体 (git --exec-path にある git.exe) を PATH の先頭に置く。同じランナーで比べるとテストが 25% 前後縮んだ
      - name: Tests
        run: |
          $env:PATH = "$([IO.Path]::GetFullPath((git --exec-path)));$env:PATH"
          cargo nextest run --locked --partition slice:${{ matrix.partition }}/5

      - name: Doctests
        if: matrix.partition == 1
        run: cargo test --locked --doc

  build:
    name: Build (${{ matrix.target }})
    # Lint とテストを待つ必要はない。全ジョブの成功で検査の範囲を確かめる。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)。release.yml の dry_run では build が
        # 走らないので、配布物を作れることはここで確かめる。Linux ARM64 は arm64 のランナーでそのまま
        # ビルドする (cross を使わない)
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # glibc を使わない静的リンク版 (Alpine や glibc の古い Docker イメージ向け)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま
      # 取り、テストの期待値や include_str! で埋め込む skills/SKILL.md の改行を配布物とそろえる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ビルドに効く環境変数 (MACOSX_DEPLOYMENT_TARGET など) は mise.toml の [env] に置く。mise-action が
      # 後続のステップへ渡すので、ci.yml と release.yml と手元の make で同じ値になる。
      # ビルドに要るのは Rust だけなので、テストランナー (cargo-nextest) は入れない
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false
          install_args: rust

      # 配布用の release の成果物だけを持つ鍵 (テストの debug の成果物と混ぜない)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
