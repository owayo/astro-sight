name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 検査の中身は Makefile の ci が定義する (fmt-check / clippy / cargo test)。
  # ここには OS 固有の準備だけを置き、検査コマンドを重ねて書かない
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows は入れない。ランナーの make は MinGW の mingw32-make の写しで、レシピの POSIX シェル前提
        # ($$(...) や [ -n ... ]) の解釈に癖がある。Windows のテストは test-windows で cargo を直接呼ぶ
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正。mise 本体は公開から 14 日以上たった版を固定し、署名付きの checksum で
      # 確かめて入れる。cache は切る。mise-action のキャッシュは mise の導入済みの印だけを戻し、rustup が
      # 持つツールチェーンと components (clippy / rustfmt) を戻さないため、復元した回だけ
      # 'cargo-clippy' is not installed で落ちる (jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)
      - uses: Swatinem/rust-cache@v2

      - run: make setup
      - run: make ci

  # テストと配布用ビルドは成果物を受け渡さないので、Windows でも独立して始める。
  test-windows:
    name: Test (Windows, ${{ matrix.suite }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4
          cache: false

      # 既存の Windows build の鍵 (key + job 名) を共有し、依存を再取得しない。
      # 保存は build に任せ、2つのテストジョブは同じキャッシュを読む。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-pc-windows-msvc-build
          save-if: 'false'

      # Git / ファイル I/O の待機を重ねる。実行時だけの設定なのでキャッシュの鍵には入れない。
      - name: Unit and binary tests
        if: matrix.suite == 'unit'
        env:
          RUST_TEST_THREADS: '8'
        run: cargo test --locked --lib --bins

      - name: Documentation tests
        if: matrix.suite == 'unit'
        run: cargo test --locked --doc

      # wildcard で全統合テストターゲットを含め、今後のターゲット追加も漏らさない。
      - name: Integration tests
        if: matrix.suite == 'integration'
        env:
          RUST_TEST_THREADS: '8'
        run: cargo test --locked --test '*'

  build:
    name: Build (${{ matrix.target }})
    # Quality とテストを待つ必要はない。全ジョブの成功で従来の検査範囲を確かめる。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)。release.yml の dry_run では build が
        # 走らないので、配布物を作れることはここで確かめる。Linux ARM64 は arm64 のランナーでそのまま
        # ビルドする (cross を使わない)
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # glibc を使わない静的リンク版 (Alpine や glibc の古い Docker イメージ向け)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま
      # 取り、テストの期待値や include_str! で埋め込む skills/SKILL.md の改行を配布物とそろえる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ビルドに効く環境変数 (MACOSX_DEPLOYMENT_TARGET など) は mise.toml の [env] に置く。mise-action が
      # 後続のステップへ渡すので、ci.yml と release.yml と手元の make で同じ値になる
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.4 # 2026-10-07 公開。14 日以上経過した版を固定する
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
